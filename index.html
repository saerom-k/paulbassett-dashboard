  }
}

async function buildExcelBlob(kpi){
  const wb = new ExcelJS.Workbook();

  const DARK = {type:'pattern', pattern:'solid', fgColor:{argb:'FF2C1810'}};
  const BLUE = {type:'pattern', pattern:'solid', fgColor:{argb:'FF2E75B6'}};
  const CREAM = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFDF6EC'}};
  const NAVY = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1E3A8A'}};
  const GRAYHEAD = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF2F2F3'}};
  const WHITEBOLD = {bold:true, color:{argb:'FFFEFEFE'}};
  const RISE = 'FF1656D1', FALL = 'FFE4002B', NORMAL_TXT = 'FF17171A';
  const thin = {style:'thin', color:{argb:'FFE0E0E0'}};
  const border = {top:thin,bottom:thin,left:thin,right:thin};

  function riseFallColor(v){ return v===null||v===undefined||!isFinite(v) ? null : (v>=0 ? RISE : FALL); }
  function achieveColor(v){ return v===null||v===undefined||!isFinite(v) ? null : (v>=1 ? RISE : FALL); }

  function styleCell(ws, cell, opts){
    if(opts.fill) cell.fill = opts.fill;
    if(opts.font) cell.font = opts.font;
    cell.alignment = Object.assign({vertical:'middle', horizontal:'center', wrapText:false}, opts.align||{});
    if(opts.numFmt) cell.numFmt = opts.numFmt;
    if(opts.border!==false) cell.border = border;
  }
  function setColWidths(ws, wide){
    ws.getColumn(1).width = 2.5;
    ws.getColumn(2).width = wide ? 26 : 15;
    for(let c=3; c<=24; c++) ws.getColumn(c).width = 14;
  }

  /* ---------------- 1. 대시보드 (요약) ---------------- */
  const ws1 = wb.addWorksheet('대시보드', { views:[{showGridLines:false}] });
  setColWidths(ws1, false);
  function merge1(r1,c1,r2,c2){ ws1.mergeCells(r1,c1,r2,c2); }
  function kpiBlock(r, c, span, label, value, numFmt, valueColor){
    merge1(r, c, r, c+span-1);
    const lc = ws1.getCell(r,c); lc.value = label; styleCell(ws1, lc, {fill:BLUE, font:WHITEBOLD});
    merge1(r+1, c, r+1, c+span-1);
    const vc = ws1.getCell(r+1,c); vc.value = value;
    styleCell(ws1, vc, {fill:CREAM, font:{bold:true, size:15, color:{argb: valueColor || 'FF6B3A2A'}}, numFmt});
    ws1.getRow(r).height = 20; ws1.getRow(r+1).height = 26;
  }

  merge1(2,2,2,21);
  const title = ws1.getCell(2,2);
  title.value = `Paul Bassett  |  ${kpi.storeName}  매출 현황 대시보드  ${kpi.YEAR}년 ${kpi.MONTH}월 (기준일 ${kpi.DAY_CUTOFF}일)`;
  styleCell(ws1, title, {fill:DARK, font:{bold:true, size:16, color:{argb:'FFFEFEFE'}}, align:{horizontal:'left'}, border:false});
  ws1.getRow(2).height = 30;

  const cumAchieve = kpi.cumTarget>0 ? kpi.cumNet/kpi.cumTarget : 0;
  const monthAchieve = kpi.monthTargetTotal>0 ? kpi.forecast/kpi.monthTargetTotal : 0;
  const cumGrowth = kpi.cumLastYear>0 ? (kpi.cumNet/kpi.cumLastYear - 1) : null;
  const forecastGrowth = kpi.lastYearMonthTotal>0 ? (kpi.forecast/kpi.lastYearMonthTotal - 1) : null;
  const hcDiff = kpi.lastYearTraffic ? kpi.avgHeadcount - kpi.lastYearTraffic.avgHeadcount : null;
  const costDiff = kpi.lastYearTraffic ? kpi.avgHeadcost - kpi.lastYearTraffic.headcost : null;

  kpiBlock(4, 2, 3, `당월 누계 매출(1일~${kpi.DAY_CUTOFF}일)`, kpi.cumNet, '#,##0"원"');
  kpiBlock(4, 5, 3, '당월 누계 목표', kpi.cumTarget, '#,##0"원"');
  kpiBlock(4, 8, 2, '누계 달성률', cumAchieve, '0.0%', achieveColor(cumAchieve));
  kpiBlock(4, 10, 2, '전년 동기 매출', kpi.cumLastYear, '#,##0"원"');
  kpiBlock(4, 12, 2, '전년비 성장률', cumGrowth===null?'-':cumGrowth, cumGrowth===null?undefined:'+0.0%;-0.0%', riseFallColor(cumGrowth));

  kpiBlock(7, 2, 3, '당월 예상 실적(1일~말일)', kpi.forecast, '#,##0"원"');
  kpiBlock(7, 5, 3, '당월 목표', kpi.monthTargetTotal, '#,##0"원"');
  kpiBlock(7, 8, 2, '목표 달성률', monthAchieve, '0.0%', achieveColor(monthAchieve));
  kpiBlock(7, 10, 2, '전년 동월 매출', kpi.lastYearMonthTotal, '#,##0"원"');
  kpiBlock(7, 12, 2, '전년비 성장률', forecastGrowth===null?'-':forecastGrowth, forecastGrowth===null?undefined:'+0.0%;-0.0%', riseFallColor(forecastGrowth));

  const channelTotal = kpi.posTotal + kpi.kioskTotal + kpi.deliveryTotal;
  const posShare = channelTotal>0? kpi.posTotal/channelTotal:0;
  const kioskShare = channelTotal>0? kpi.kioskTotal/channelTotal:0;
  const deliveryShare = channelTotal>0? kpi.deliveryTotal/channelTotal:0;
  kpiBlock(10, 2, 2, 'POS 매출', kpi.posTotal, '#,##0"원"');
  merge1(12,2,12,3); const posP = ws1.getCell(12,2); posP.value = posShare; styleCell(ws1, posP, {font:{size:10,color:{argb:'FF6B3A2A'}}, numFmt:'"비중 "0.0%', fill:CREAM, border:false});
  kpiBlock(10, 4, 2, 'KIOSK 매출', kpi.kioskTotal, '#,##0"원"');
  merge1(12,4,12,5); const kioskP = ws1.getCell(12,4); kioskP.value = kioskShare; styleCell(ws1, kioskP, {font:{size:10,color:{argb:'FF6B3A2A'}}, numFmt:'"비중 "0.0%', fill:CREAM, border:false});
  kpiBlock(10, 6, 2, '배달 매출', kpi.deliveryTotal, '#,##0"원"');
  merge1(12,6,12,7); const dlvP = ws1.getCell(12,6); dlvP.value = deliveryShare; styleCell(ws1, dlvP, {font:{size:10,color:{argb:'FF6B3A2A'}}, numFmt:'"비중 "0.0%', fill:CREAM, border:false});
  ws1.getRow(12).height = 16;

  const weekdayGrowth = (kpi.lastYearTraffic && kpi.lastYearTraffic.weekdayStats.avgNet>0) ? (kpi.weekdayStats.avgNet - kpi.lastYearTraffic.weekdayStats.avgNet)/kpi.lastYearTraffic.weekdayStats.avgNet : null;
  const weekendGrowth = (kpi.lastYearTraffic && kpi.lastYearTraffic.weekendStats.avgNet>0) ? (kpi.weekendStats.avgNet - kpi.lastYearTraffic.weekendStats.avgNet)/kpi.lastYearTraffic.weekendStats.avgNet : null;
  kpiBlock(10, 8, 2, '평일 일평균', kpi.weekdayStats.avgNet, '#,##0"원"');
  merge1(12,8,12,9); const wdG = ws1.getCell(12,8); wdG.value = weekdayGrowth===null?'-':weekdayGrowth; styleCell(ws1, wdG, {font:{size:10,color: weekdayGrowth===null?{argb:'FF6B3A2A'}:{argb:riseFallColor(weekdayGrowth)}}, numFmt: weekdayGrowth===null?undefined:'"전년비 "+0.0%;"전년비 "-0.0%', fill:CREAM, border:false, align:{horizontal:'center'}});
  kpiBlock(10, 10, 2, '주말 일평균', kpi.weekendStats.avgNet, '#,##0"원"');
  merge1(12,10,12,11); const weG = ws1.getCell(12,10); weG.value = weekendGrowth===null?'-':weekendGrowth; styleCell(ws1, weG, {font:{size:10,color: weekendGrowth===null?{argb:'FF6B3A2A'}:{argb:riseFallColor(weekendGrowth)}}, numFmt: weekendGrowth===null?undefined:'"전년비 "+0.0%;"전년비 "-0.0%', fill:CREAM, border:false, align:{horizontal:'center'}});

  function sectionHeader1(rr, text, color){
    merge1(rr,2,rr,21);
    const c = ws1.getCell(rr,2); c.value = text;
    styleCell(ws1, c, {fill:color||NAVY, font:WHITEBOLD, align:{horizontal:'left'}, border:false});
    ws1.getRow(rr).height = 20;
  }
  function tableHeaderRow1(rr, headers, startCol){
    headers.forEach((h,i)=>{
      const c = ws1.getCell(rr, startCol+i);
      c.value = h; styleCell(ws1, c, {fill:GRAYHEAD, font:{bold:true, size:10}});
    });
  }

  /* ---- 조수 · 조단가 (당월/전년/전년비를 한 구역에 모아서 표시) ---- */
  sectionHeader1(14, '조수 · 조단가');
  kpiBlock(15, 2, 2, '당월 조수', kpi.avgHeadcount, '#,##0"명"');
  kpiBlock(15, 4, 2, '당월 조단가', kpi.avgHeadcost, '#,##0"원"');
  if(kpi.lastYearTraffic){
    kpiBlock(15, 6, 2, '전년도 조수', kpi.lastYearTraffic.avgHeadcount, '#,##0"명"');
    kpiBlock(15, 8, 2, '전년도 조단가', kpi.lastYearTraffic.headcost, '#,##0"원"');
    kpiBlock(15, 10, 2, '조수 전년비', hcDiff, '+#,##0"명";-#,##0"명"', riseFallColor(hcDiff));
    kpiBlock(15, 12, 2, '조단가 전년비', costDiff, '+#,##0"원";-#,##0"원"', riseFallColor(costDiff));
  }

  let r = 19;
  sectionHeader1(r, `${kpi.YEAR}년 월별 실적`);
  r += 1;
  tableHeaderRow1(r, ['구분', ...Array.from({length:12},(_,i)=>`${i+1}월`), `${kpi.YEAR}년 합계`], 2);
  r += 1;
  // 월평균 달성률/전년대비 합계는 실제 26년 실적(또는 당월 예상치)이 입력된 달만 반영합니다.
  const dataMonths = kpi.annual.filter(a=>a.actual>0);
  const dataTargetSum = dataMonths.reduce((s,a)=>s+a.target,0);
  const dataActualSum = dataMonths.reduce((s,a)=>s+a.actual,0);
  const dataLastYearSum = dataMonths.reduce((s,a)=>s+a.lastYear,0);
  const sumAchieve = dataTargetSum>0 ? dataActualSum/dataTargetSum : null;
  const sumYoy = dataLastYearSum>0 ? (dataActualSum-dataLastYearSum)/dataLastYearSum : null;
  const rowsDef = [
    ['목표 매출', kpi.annual.map(a=>a.target), '#,##0"원"', null, dataTargetSum],
    ['전년 실적', kpi.annual.map(a=>a.lastYear), '#,##0"원"', null, dataLastYearSum],
    [`${kpi.YEAR}년 실적`, kpi.annual.map(a=>a.actual), '#,##0"원"', null, dataActualSum],
    ['달성률', kpi.annual.map(a=>a.achieveRate), '0.0%', 'achieve', sumAchieve],
    ['전년대비', kpi.annual.map(a=>a.yoy), '+0.0%;-0.0%', 'growth', sumYoy],
  ];
  rowsDef.forEach(([label, arr, fmt, colorMode, sumVal])=>{
    const lc = ws1.getCell(r,2); lc.value = label; styleCell(ws1, lc, {font:{bold:true,size:10}, align:{horizontal:'left'}});
    arr.forEach((v,i)=>{
      const c = ws1.getCell(r, 3+i);
      c.value = (v===null||v===undefined)?'-':v;
      const color = colorMode==='achieve' ? achieveColor(v) : (colorMode==='growth' ? riseFallColor(v) : null);
      styleCell(ws1, c, {font:{size:10, color: color?{argb:color}:undefined}, numFmt: v!=='-' ? fmt : undefined});
    });
    const sc = ws1.getCell(r, 15);
    sc.value = (sumVal===null||sumVal===undefined)?'-':sumVal;
    const sumColor = colorMode==='achieve' ? achieveColor(sumVal) : (colorMode==='growth' ? riseFallColor(sumVal) : null);
    styleCell(ws1, sc, {font:{bold:true, size:10, color: sumColor?{argb:sumColor}:undefined}, fill:GRAYHEAD, numFmt: sumVal!=='-' ? fmt : undefined});
    r += 1;
  });

  /* ---------------- 2. 일별입력 (당월 일자별 상세) ---------------- */
  const ws2 = wb.addWorksheet('일별입력', { views:[{showGridLines:false}] });
  setColWidths(ws2, false);
  ws2.getColumn(2).width = 12;
  const dayHeaders = ['일자','요일','순매출','일자별목표','달성률','전년매출','전년비','조수','조단가','POS','POS 비중','KIOSK','KIOSK 비중','배달','배달 비중'];
  dayHeaders.forEach((h,i)=>{ const c=ws2.getCell(2,2+i); c.value=h; styleCell(ws2,c,{fill:GRAYHEAD, font:{bold:true,size:10}}); });
  kpi.daily.forEach((d,idx)=>{
    const rr = 3+idx;
    const dayChannelTotal = d.posNet + d.kioskNet + d.deliveryNet;
    const posShareDay = dayChannelTotal>0 ? d.posNet/dayChannelTotal : 0;
    const kioskShareDay = dayChannelTotal>0 ? d.kioskNet/dayChannelTotal : 0;
    const deliveryShareDay = dayChannelTotal>0 ? d.deliveryNet/dayChannelTotal : 0;
    const vals = [d.dateStr, d.weekdayText || ['월','화','수','목','금','토','일'][d.dow-1], d.net, d.target, d.achieveRate, d.lastYearNet, d.yoyGrowth, d.headcount, d.headcost, d.posNet, posShareDay, d.kioskNet, kioskShareDay, d.deliveryNet, deliveryShareDay];
    const fmts = [null,null,'#,##0"원"','#,##0"원"','0.0%','#,##0"원"','+0.0%;-0.0%','#,##0"명"','#,##0"원"','#,##0"원"','0.0%','#,##0"원"','0.0%','#,##0"원"','0.0%'];
    vals.forEach((v,i)=>{
      const c = ws2.getCell(rr, 2+i);
      c.value = (v===null||v===undefined) ? '-' : v;
      let color = null;
      if(i===6) color = riseFallColor(v);
      styleCell(ws2, c, {font:{size:10, color: color?{argb:color}:undefined}, numFmt: v!=='-'?fmts[i]:undefined, align:{horizontal:i<=1?'center':'right'}, border:true});
    });
  });
  {
    const rrTotal = 3 + kpi.daily.length;
    const totalAchieve = kpi.cumTarget>0 ? kpi.cumNet/kpi.cumTarget : null;
    const totalYoy = kpi.cumLastYear>0 ? (kpi.cumNet-kpi.cumLastYear)/kpi.cumLastYear : null;
    const totalVals = ['합계', '', kpi.cumNet, kpi.cumTarget, totalAchieve, kpi.cumLastYear, totalYoy, kpi.avgHeadcount, kpi.avgHeadcost, kpi.posTotal, posShare, kpi.kioskTotal, kioskShare, kpi.deliveryTotal, deliveryShare];
    const totalFmts = [null,null,'#,##0"원"','#,##0"원"','0.0%','#,##0"원"','+0.0%;-0.0%','#,##0"명"','#,##0"원"','#,##0"원"','0.0%','#,##0"원"','0.0%','#,##0"원"','0.0%'];
    totalVals.forEach((v,i)=>{
      const c = ws2.getCell(rrTotal, 2+i);
      c.value = (v===null||v===undefined||v==='') ? (i===1?'':'-') : v;
      let color = null;
      if(i===6) color = riseFallColor(v);
      styleCell(ws2, c, {fill:GRAYHEAD, font:{bold:true, size:10, color: color?{argb:color}:undefined}, numFmt: (v!=='-'&&v!=='')?totalFmts[i]:undefined, align:{horizontal:i<=1?'center':'right'}, border:true});
    });
  }

  /* ---------------- 3. 상품분석 (카테고리 + TOP20) ---------------- */
  const ws3 = wb.addWorksheet('상품분석', { views:[{showGridLines:false}] });
  ws3.getColumn(1).width = 2.5;
  ws3.getColumn(2).width = 22;
  ws3.getColumn(3).width = 30;
  for(let c=4; c<=9; c++) ws3.getColumn(c).width = 14;
  function sectionHeader3(rr, text){
    ws3.mergeCells(rr,2,rr,9);
    const c = ws3.getCell(rr,2); c.value = text;
    styleCell(ws3, c, {fill:NAVY, font:WHITEBOLD, align:{horizontal:'left'}, border:false});
    ws3.getRow(rr).height = 20;
  }
  function tableHeaderRow3(rr, headers, startCol){
    headers.forEach((h,i)=>{ const c = ws3.getCell(rr, startCol+i); c.value=h; styleCell(ws3,c,{fill:GRAYHEAD, font:{bold:true,size:10}}); });
  }
  let r3 = 2;
  sectionHeader3(r3, '카테고리별 매출 — 대분류 (당월 / 전년 비교)'); r3+=1;
  tableHeaderRow3(r3, ['대분류','수량','매출(VAT 별도)','비중','전년수량','전년매출','성장률','전년비중'], 2); r3+=1;
  kpi.midList.forEach(x=>{
    const growth = (x.lyNet!=null && x.lyNet>0) ? (x.net-x.lyNet)/x.lyNet : null;
    const vals = [x.name, x.qty, x.net, x.share, x.lyQty, x.lyNet, growth, x.lyShare];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = (v===null||v===undefined) ? '-' : v;
      const fmt = [null,'#,##0','#,##0"원"','0.0%','#,##0','#,##0"원"','+0.0%;-0.0%','0.0%'][i];
      const color = (i===6) ? riseFallColor(growth) : null;
      styleCell(ws3, c, {font:{size:10, color: color?{argb:color}:undefined}, numFmt: (v!=='-' && fmt) ? fmt : undefined, align:{horizontal: i===0?'left':'center'}});
    });
    r3 += 1;
  });
  {
    const midQtySum = kpi.midList.reduce((s,x)=>s+x.qty,0);
    const midLyQtySum = kpi.midList.reduce((s,x)=>s+(x.lyQty||0),0);
    const midLyNetSum = kpi.midList.reduce((s,x)=>s+(x.lyNet||0),0);
    const midGrowthSum = midLyNetSum>0 ? (kpi.midTotal-midLyNetSum)/midLyNetSum : null;
    const hasLY = kpi.midList.some(x=>x.lyNet!=null);
    const vals = ['합계', midQtySum, kpi.midTotal, 1, hasLY?midLyQtySum:'-', hasLY?midLyNetSum:'-', hasLY?midGrowthSum:'-', hasLY?1:'-'];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = (v===null||v===undefined) ? '-' : v;
      const fmt = [null,'#,##0','#,##0"원"','0.0%','#,##0','#,##0"원"','+0.0%;-0.0%','0.0%'][i];
      const color = (i===6 && v!=='-') ? riseFallColor(v) : null;
      styleCell(ws3, c, {fill:GRAYHEAD, font:{bold:true, size:10, color: color?{argb:color}:undefined}, numFmt: (v!=='-' && fmt) ? fmt : undefined, align:{horizontal: i===0?'left':'center'}});
    });
    r3 += 1;
  }
  r3 += 1;
  sectionHeader3(r3, '카테고리별 매출 — 소분류 (당월 / 전년 비교)'); r3+=1;
  tableHeaderRow3(r3, ['소분류','수량','매출(VAT 별도)','비중','전년수량','전년매출','성장률','전년비중'], 2); r3+=1;
  kpi.subList.forEach(x=>{
    const growth = (x.lyNet!=null && x.lyNet>0) ? (x.net-x.lyNet)/x.lyNet : null;
    const vals = [x.name, x.qty, x.net, x.share, x.lyQty, x.lyNet, growth, x.lyShare];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = (v===null||v===undefined) ? '-' : v;
      const fmt = [null,'#,##0','#,##0"원"','0.0%','#,##0','#,##0"원"','+0.0%;-0.0%','0.0%'][i];
      const color = (i===6) ? riseFallColor(growth) : null;
      styleCell(ws3, c, {font:{size:10, color: color?{argb:color}:undefined}, numFmt: (v!=='-' && fmt) ? fmt : undefined, align:{horizontal: i===0?'left':'center'}});
    });
    r3 += 1;
  });
  {
    const subQtySum = kpi.subList.reduce((s,x)=>s+x.qty,0);
    const subLyQtySum = kpi.subList.reduce((s,x)=>s+(x.lyQty||0),0);
    const subLyNetSum = kpi.subList.reduce((s,x)=>s+(x.lyNet||0),0);
    const subGrowthSum = subLyNetSum>0 ? (kpi.subTotal-subLyNetSum)/subLyNetSum : null;
    const hasLY = kpi.subList.some(x=>x.lyNet!=null);
    const vals = ['합계', subQtySum, kpi.subTotal, 1, hasLY?subLyQtySum:'-', hasLY?subLyNetSum:'-', hasLY?subGrowthSum:'-', hasLY?1:'-'];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = (v===null||v===undefined) ? '-' : v;
      const fmt = [null,'#,##0','#,##0"원"','0.0%','#,##0','#,##0"원"','+0.0%;-0.0%','0.0%'][i];
      const color = (i===6 && v!=='-') ? riseFallColor(v) : null;
      styleCell(ws3, c, {fill:GRAYHEAD, font:{bold:true, size:10, color: color?{argb:color}:undefined}, numFmt: (v!=='-' && fmt) ? fmt : undefined, align:{horizontal: i===0?'left':'center'}});
    });
    r3 += 1;
  }
  r3 += 1;
  sectionHeader3(r3, '판매 상위 TOP 20'); r3+=1;
  tableHeaderRow3(r3, ['순위','상품명','판매수량','매출(VAT 별도)','비중'], 2); r3+=1;
  kpi.productTop20.forEach(x=>{
    const vals = [x.rank, x.name, x.qty, x.net, x.share];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = v;
      const fmt = [null,null,'#,##0','#,##0"원"','0.0%'][i];
      styleCell(ws3, c, {font:{size:10}, numFmt: fmt, align:{horizontal: i===1?'left':'center'}});
    });
    r3 += 1;
  });
  {
    const top20QtySum = kpi.productTop20.reduce((s,x)=>s+x.qty,0);
    const top20NetSum = kpi.productTop20.reduce((s,x)=>s+x.net,0);
    const top20Share = kpi.prodTotalNet>0 ? top20NetSum/kpi.prodTotalNet : 0;
    const vals = ['', 'TOP 20 합계', top20QtySum, top20NetSum, top20Share];
    vals.forEach((v,i)=>{
      const c = ws3.getCell(r3, 2+i);
      c.value = v;
      const fmt = [null,null,'#,##0','#,##0"원"','0.0%'][i];
      styleCell(ws3, c, {fill:GRAYHEAD, font:{bold:true,size:10}, numFmt: fmt, align:{horizontal: i===1?'left':'center'}});
    });
    r3 += 1;
  }

  /* ---------------- 3-1. 상품분석(전체) — 매출액 기준 전체 상품 순위 ---------------- */
  const ws3b = wb.addWorksheet('상품분석(전체)', { views:[{showGridLines:false}] });
  ws3b.getColumn(1).width = 2.5;
  ws3b.getColumn(2).width = 8;
  ws3b.getColumn(3).width = 34;
  for(let c=4; c<=6; c++) ws3b.getColumn(c).width = 14;
  ws3b.mergeCells(2,2,2,6);
  const ws3bTitle = ws3b.getCell(2,2);
  ws3bTitle.value = `전체 상품 매출 순위 (매출액 기준, 총 ${kpi.productAll.length}개)`;
  styleCell(ws3b, ws3bTitle, {fill:NAVY, font:WHITEBOLD, align:{horizontal:'left'}, border:false});
  ws3b.getRow(2).height = 20;
  const ws3bHeaders = ['순위','상품명','판매수량','매출(VAT 별도)','비중'];
  ws3bHeaders.forEach((h,i)=>{ const c = ws3b.getCell(4, 2+i); c.value=h; styleCell(ws3b, c, {fill:GRAYHEAD, font:{bold:true,size:10}}); });
  kpi.productAll.forEach((x,i)=>{
    const rr = 5+i;
    const vals = [x.rank, x.name, x.qty, x.net, x.share];
    vals.forEach((v,i2)=>{
      const c = ws3b.getCell(rr, 2+i2);
      c.value = v;
      const fmt = [null,null,'#,##0','#,##0"원"','0.0%'][i2];
      styleCell(ws3b, c, {font:{size:10}, numFmt: fmt, align:{horizontal: i2===1?'left':'center'}});
    });
  });
  {
    const rrTotal = 5 + kpi.productAll.length;
    const totalVals = ['', '합계', kpi.prodTotalQty, kpi.prodTotalNet, kpi.prodTotalNet>0?1:0];
    totalVals.forEach((v,i2)=>{
      const c = ws3b.getCell(rrTotal, 2+i2);
      c.value = v;
      const fmt = [null,null,'#,##0','#,##0"원"','0.0%'][i2];
      styleCell(ws3b, c, {fill:GRAYHEAD, font:{bold:true,size:10}, numFmt: fmt, align:{horizontal: i2===1?'left':'center'}});
    });
  }

  /* ---------------- 4. 폐기현황 ---------------- */
  const ws4 = wb.addWorksheet('폐기현황', { views:[{showGridLines:false}] });
  ws4.getColumn(1).width = 2.5;
  ws4.getColumn(2).width = 8;
  ws4.getColumn(3).width = 30;
  ws4.getColumn(4).width = 12;
  ws4.getColumn(5).width = 12;
  ws4.getColumn(6).width = 18;
  ws4.getColumn(7).width = 12;
  ws4.getColumn(8).width = 16;
  ws4.mergeCells(2,2,2,9);
  const wtitle = ws4.getCell(2,2); wtitle.value = '폐기 현황 요약';
  styleCell(ws4, wtitle, {fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFE4002B'}}, font:WHITEBOLD, align:{horizontal:'left'}, border:false});
  ws4.getRow(2).height = 20;
  const wSummary = [['폐기 수량', kpi.wasteTotalQty, '#,##0'], ['폐기금액(VAT 별도)', kpi.wasteTotalAmt, '#,##0"원"'], ['폐기율', kpi.wasteRate, '0.00%']];
  wSummary.forEach(([label,val,fmt],i)=>{
    const lc = ws4.getCell(4, 2+i*2); lc.value = label; ws4.mergeCells(4,2+i*2,4,3+i*2); styleCell(ws4, lc, {fill:BLUE, font:WHITEBOLD});
    const vc = ws4.getCell(5, 2+i*2); vc.value = val; ws4.mergeCells(5,2+i*2,5,3+i*2); styleCell(ws4, vc, {fill:CREAM, font:{bold:true,size:14,color:{argb:'FF6B3A2A'}}, numFmt:fmt});
  });
  ws4.getRow(4).height=20; ws4.getRow(5).height=24;
  if(kpi.hasWaste && kpi.wasteAll.length){
    let r4 = 8;
    ws4.mergeCells(r4,2,r4,8);
    const wListTitle = ws4.getCell(r4,2); wListTitle.value = `폐기 전체 순위 (폐기금액 기준, 총 ${kpi.wasteAll.length}개)`;
    styleCell(ws4, wListTitle, {fill:NAVY, font:WHITEBOLD, align:{horizontal:'left'}, border:false});
    ws4.getRow(r4).height = 20;
    r4 += 1;
    const wHeaders = ['순위','상품명','폐기수량','단가','폐기금액(VAT 별도)','폐기율','폐기사유'];
    wHeaders.forEach((h,i)=>{ const c=ws4.getCell(r4,2+i); c.value=h; styleCell(ws4,c,{fill:GRAYHEAD, font:{bold:true,size:10}}); });
    r4+=1;
    kpi.wasteAll.forEach(x=>{
      const vals = [x.rank, x.name, x.qty, x.unitPrice, x.amt, x.rate, x.reason];
      vals.forEach((v,i)=>{
        const c = ws4.getCell(r4, 2+i);
        c.value = v;
        const fmt = [null,null,'#,##0','#,##0"원"','#,##0"원"','0.00%',null][i];
        styleCell(ws4, c, {font:{size:10}, numFmt: fmt, align:{horizontal: i===1?'left':'center'}});
      });
      r4 += 1;
    });
    const totalVals = ['', '합계', kpi.wasteTotalQty, '', kpi.wasteTotalAmt, kpi.wasteRate, ''];
    totalVals.forEach((v,i)=>{
      const c = ws4.getCell(r4, 2+i);
      c.value = v;
      const fmt = [null,null,'#,##0','#,##0"원"','#,##0"원"','0.00%',null][i];
      styleCell(ws4, c, {fill:GRAYHEAD, font:{bold:true,size:10}, numFmt: (v!=='')?fmt:undefined, align:{horizontal: i===1?'left':'center'}});
    });
  } else {
    ws4.mergeCells(8,2,8,9); ws4.getCell(8,2).value = '폐기 데이터 없음'; styleCell(ws4, ws4.getCell(8,2), {font:{size:10, italic:true}});
  }

  const buffer = await wb.xlsx.writeBuffer();
  return new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* 저장된 스냅샷을 담은 HTML을 열었을 때 자동으로 대시보드를 바로 표시 */
if(window.__PRELOADED_KPI__){
  render(window.__PRELOADED_KPI__);
}
</script>
</body>
</html>
